name: Publish feature
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/release.yml'
concurrency:
  group: publish-feature
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n src/orca-web/install.sh src/orca-web/install-orca.sh src/orca-web/orca-web.sh
      - run: node --test src/orca-web/orca-web-gateway.test.mjs
      - name: Publish semantic version tags to GHCR
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: ./src
          generate-docs: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
